name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alrzkyy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/pacman-contribution.svg?color_snake=yellow&color_dot_empty=#161b22&color_dot_filled_1=#4a1d96&color_dot_filled_2=#7c3aed&color_dot_filled_3=#a855f7&color_dot_filled_4=#c084fc&color_fruit=#f472b6

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
